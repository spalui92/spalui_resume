<style>
/* ============ THEME TOKENS ============ */
:root{
  --bg:#ebe8dc; --panel:#e2dfd2; --card:#e4e1d5; --line:#c9c4b3; --line2:#b9b3a0;
  --ink:#1d262b; --ink2:#3a454b; --strong:#141b1f; --muted:#76838c; --faint:#9aa3a8;
  --green:#1e7a3c; --green-d:#155c2c; --green-bg:#d9ecc9; --green-tint:#e6f1da; --on-green:#ffffff;
  --accent:#5a9e3a; --accent-l:#78b159; --feat-border:#b9d6a0;
  --feat-grad:linear-gradient(90deg,#d6eac4 0%,#e1eed3 50%,#ebe8dc 100%);
  --stat-bg:#f1f5ea; --stat-border:#c3dcae; --stat-v:#4a8f2c; --quote-bg:#eef4e6; --quote-border:#9cc97f;
  --amber:#a8660b; --amber-bg:#efdcb5; --amber-tint:#f3e7cf; --amber-border:#d8b56f;
  --blue:#2c5e9e; --blue-bg:#d6deea; --blue-border:#8fa6c7;
  --core-border:#8fb28a; --mid-border:#b3c7ad; --st-green-border:#9fbe99;
  --dot:#d3cfc2; --shadow:#c9c4b3; --barbg:rgba(235,232,220,.88); --pulse:30,122,60;
}
:root[data-theme="dark"]{
  --bg:#0a0f0b; --panel:#101812; --card:#0f1711; --line:#1d2e22; --line2:#2a4232;
  --ink:#d4f5da; --ink2:#a8d5b1; --strong:#e6ffe9; --muted:#6a8f73; --faint:#4f6b57;
  --green:#3ddc84; --green-d:#7af0a8; --green-bg:#11301c; --green-tint:#0e2216; --on-green:#04110a;
  --accent:#3ddc84; --accent-l:#2fb36a; --feat-border:#245236;
  --feat-grad:linear-gradient(90deg,#0f2a19 0%,#0d1f14 50%,#0a0f0b 100%);
  --stat-bg:#0c1d12; --stat-border:#1f4a2e; --stat-v:#3ddc84; --quote-bg:#0c1a10; --quote-border:#2a6a43;
  --amber:#f0b25a; --amber-bg:#3a2a10; --amber-tint:#2a200f; --amber-border:#6b4f1f;
  --blue:#8ab8ff; --blue-bg:#122036; --blue-border:#2d4a73;
  --core-border:#2f7a4a; --mid-border:#24503a; --st-green-border:#2f7a4a;
  --dot:#132017; --shadow:#000000; --barbg:rgba(10,15,11,.88); --pulse:61,220,132;
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--bg)}
body{
  font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  color:var(--ink); font-size:12.5px; line-height:1.62;
  background-image:radial-gradient(var(--dot) 1px,var(--bg) 1px);
  background-size:22px 22px; overflow-x:clip;
  transition:background-color .4s,color .4s;
}
body.booting{overflow:hidden}
.page{max-width:1320px;margin:0 auto;padding:44px 64px 48px}
a{color:inherit;text-decoration:none}
a:hover{color:var(--green)}
button{font-family:inherit}
[id]{scroll-margin-top:96px}
::selection{background:var(--green);color:var(--on-green)}
:focus-visible{outline:2px dashed var(--green);outline-offset:3px}

/* ============ TOP BAR / CLI ============ */
.topbar{position:sticky;top:0;z-index:50;background:var(--barbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 64px;display:flex;gap:10px;align-items:center}
.cli{flex:1;display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--line2);background:var(--panel);padding:7px 12px;box-shadow:2px 2px 0 var(--shadow);transition:border-color .2s}
.cli:focus-within{border-color:var(--green)}
.ps1{color:var(--green);white-space:nowrap;font-size:12px;cursor:text}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;font-size:12.5px;color:var(--ink);caret-color:var(--green)}
#cmd::placeholder{color:var(--faint)}
.kbd{font-size:10px;color:var(--muted);border:1px solid var(--line2);padding:0 5px;white-space:nowrap}
.tbtn{font-size:11px;letter-spacing:.08em;padding:8px 12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.tbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow);color:var(--ink)}
.tbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.tbtn.solid{background:var(--green);color:var(--on-green);border-color:var(--green-d)}
.tbtn.solid:hover{color:var(--on-green)}
.console{max-width:1320px;margin:0 auto;padding:0 64px 12px}
.con-in{position:relative;border:1px solid var(--line2);background:var(--panel);max-height:42vh;overflow:auto;padding:10px 40px 10px 14px;font-size:12px;box-shadow:3px 3px 0 var(--shadow);animation:drop .25s ease-out}
.con-close{position:absolute;right:8px;top:8px;background:none;border:1px solid var(--line2);color:var(--muted);font-size:11px;padding:1px 7px;cursor:pointer}
.ln{padding:2px 0;color:var(--ink2);line-height:1.75}
.ln .ps{color:var(--green)}
.ln a{color:var(--green-d);text-decoration:underline}
.ln b{color:var(--ink)}
.dim2{color:var(--muted)}
.ok{color:var(--green)}
.dirl{color:var(--blue);margin-right:14px;white-space:nowrap}
.run{font-size:11px;color:var(--green-d);background:var(--green-tint);border:1px solid var(--line2);padding:0 7px;cursor:pointer;margin:2px 4px 2px 0}
.run:hover{border-color:var(--green)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ============ HEADER ============ */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line2)}
.prompt{color:var(--green);font-size:12px;letter-spacing:.02em}
.prompt b{color:var(--muted);font-weight:400;margin-right:6px}
h1{font-size:52px;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:4px 0 12px;min-height:1.15em}
h1 .cur{display:inline-block;width:.25em;height:.8em;background:var(--green);margin-left:.12em;vertical-align:-.06em;cursor:pointer;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:7px;flex-wrap:nowrap}
.chip{font-size:10px;letter-spacing:.1em;white-space:nowrap;color:var(--green-d);border:1px solid var(--line2);background:var(--green-tint);padding:4px 10px;box-shadow:2px 2px 0 var(--shadow)}
.contact{white-space:nowrap;text-align:right;font-size:12px;line-height:2}
.contact span{color:var(--faint);margin-right:6px;font-size:11px}
.copy{font-size:9.5px;letter-spacing:.06em;margin-left:8px;padding:0 6px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;vertical-align:1px}
.copy:hover{color:var(--green);border-color:var(--green)}

/* ============ SECTION HEADS ============ */
.sh{font-size:11px;letter-spacing:.55em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:9px;margin:30px 0 16px}
.sh em{font-style:normal;color:var(--green)}

/* ============ SUMMARY ============ */
.summary{background:var(--panel);border-left:4px solid var(--green);padding:18px 26px 18px 38px;position:relative;color:var(--strong);font-size:13.5px;line-height:1.8}
.summary:before{content:"\201C";position:absolute;left:12px;top:6px;font-size:30px;color:var(--green);opacity:.55}
.summary .biz{display:block;margin-top:8px;color:var(--strong);border-top:1px dashed var(--line2);padding-top:8px}
.summary .hl{color:var(--green-d);font-weight:500}
.summary .biz b{color:var(--green-d);font-weight:500}

/* ============ FILTER ============ */
.filter{display:flex;align-items:center;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.fl{color:var(--muted);font-size:11px;margin-right:4px;white-space:nowrap}
.fchip{font-size:11px;padding:4px 11px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);cursor:pointer;letter-spacing:.04em;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.fchip:hover{border-color:var(--green);color:var(--green-d)}
.fchip.on{background:var(--green);color:var(--on-green);border-color:var(--green-d);box-shadow:2px 2px 0 var(--shadow)}
[data-t]{transition:opacity .4s,filter .4s,outline-color .4s}
html.filtering .dim{opacity:.22!important;filter:grayscale(1)}
html.filtering .hit{outline:1px dashed var(--green);outline-offset:5px}

/* ============ GRID ============ */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:48px}
.grid>*{min-width:0}

/* ============ EXPERIENCE ============ */
.job{margin-bottom:22px;transition:transform .25s}
.job-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.job h3{font-size:14.5px;font-weight:500}
.job .date{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.job .co{color:var(--amber);font-size:12px;margin:1px 0 8px}
.job .co i{color:var(--muted);font-style:normal}
.job ul{list-style:none}
.job li{position:relative;padding-left:24px;margin-bottom:5px;color:var(--ink2)}
.job li:before{content:"//";position:absolute;left:0;color:var(--muted)}
.job li b{font-weight:500;color:var(--ink)}
.job.collapsed li.more{display:none}
.job li.more{animation:fade .35s ease-out}
.job.feature{background:var(--feat-grad);border:1px solid var(--line2);border-left:4px solid var(--accent-l);padding:14px 18px 10px;box-shadow:4px 4px 0 var(--shadow)}
.job.feature .co{color:var(--green-d)}
.job.feature li:before{content:"▸";color:var(--green)}
.expand{font-size:10.5px;color:var(--green);background:none;border:0;padding:2px 0 4px 24px;cursor:pointer;letter-spacing:.04em}
.expand:hover{text-decoration:underline}
.tagrow{display:flex;gap:6px;margin:-2px 0 10px;flex-wrap:wrap}
.tag{font-size:9.5px;letter-spacing:.14em;padding:2px 7px;border:1px solid var(--line2);color:var(--green-d);background:var(--bg)}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* ============ PILLS ============ */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;padding:3px 9px;border:1px solid var(--line2);background:var(--panel);transition:transform .15s,border-color .15s}
.pill:hover{transform:translateY(-1px);border-color:var(--green)}
.pill.blue{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue)}
.pill.core{background:var(--green-bg);color:var(--green-d);border-color:var(--core-border);border-left:3px solid var(--green)}
.pill.mid{background:var(--green-tint);color:var(--ink2);border-color:var(--mid-border)}
.pill[data-tip]{position:relative;cursor:help}
@media (hover:hover){
  .pill[data-tip]:hover::after,.pill[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);background:var(--ink);color:var(--bg);font-size:10.5px;padding:5px 9px;white-space:nowrap;z-index:5;box-shadow:3px 3px 0 var(--green);pointer-events:none;animation:fade .18s}
}

/* ============ KEY SKILLS ============ */
.ks-quote{background:var(--feat-grad);color:var(--ink2);padding:16px 18px 14px 20px;position:relative;border:1px solid var(--feat-border);border-left:4px solid var(--accent);margin-bottom:14px}
.ks-quote:before{content:"❝";position:absolute;right:14px;top:4px;font-size:34px;color:var(--accent-l);opacity:.7}
.ks-quote .lbl{font-size:10px;letter-spacing:.3em;color:var(--accent);margin-bottom:6px}
.ks-quote p{font-style:italic;font-size:12px;line-height:1.7;padding-right:30px}
.ks-quote p b{color:var(--green-d);font-weight:500;font-style:normal}
.cluster{border:1px solid var(--line2);background:var(--card);padding:10px 14px 12px;margin-bottom:10px;transition:box-shadow .2s,transform .2s}
.cluster:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--shadow)}
.cluster-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;color:var(--ink);margin-bottom:8px;font-weight:500}
.cluster-h .n{color:var(--green);margin-right:8px}
.cluster-h .wt{font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-weight:400;white-space:nowrap;display:inline-flex;align-items:center}
.bar{display:inline-flex;gap:2px;margin-left:6px}
.bar b{width:9px;height:9px;border:1px solid var(--line2);background:transparent}
.bar b.on{background:var(--green);border-color:var(--green)}
.js .rv .bar b.on{background:transparent;transition:background .3s;transition-delay:calc(var(--i)*110ms + .25s)}
.js .rv.in .bar b.on{background:var(--green)}
.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin:2px 0 4px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line2)}
.legend .l1:before{background:var(--green-bg);border-left:3px solid var(--green)}
.legend .l2:before{background:var(--green-tint)}
.legend .l3:before{background:var(--panel)}

/* ============ BUSINESS TERMINAL ============ */
.term{border:1px solid var(--feat-border);border-left:4px solid var(--accent);background:var(--feat-grad);color:var(--ink2);box-shadow:4px 4px 0 var(--shadow)}
.term-bar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--feat-border);font-size:10.5px;color:var(--muted)}
.term-bar i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent-l);opacity:.75}
.term-bar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-body{padding:14px 16px 16px}
.cmd{color:var(--accent);font-size:11.5px}
.cmd b{color:var(--muted);font-weight:400}
.biz-id{margin:6px 0 12px;font-size:11px;color:var(--muted);line-height:1.7}
.biz-id strong{display:block;color:var(--ink);font-size:15px;font-weight:700;letter-spacing:.02em}
.biz-id em{font-style:normal;color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.stat{background:var(--stat-bg);border:1px solid var(--stat-border);padding:9px 10px 8px;transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--feat-border)}
.stat .v{font-size:19px;font-weight:700;color:var(--stat-v);line-height:1.2;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;color:var(--muted);font-weight:400}
.stat .k{font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px;line-height:1.35}
.ops{list-style:none;font-size:11.2px;line-height:1.6}
.ops li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--feat-border)}
.ops li .kk{color:var(--green-d)}
.ops li .kk:before{content:"◆ ";color:var(--accent-l);font-size:9px}
.ops li .vv{color:var(--ink2)}
.biz-quote{margin-top:12px;border:1px dashed var(--quote-border);background:var(--quote-bg);padding:10px 12px 10px 34px;position:relative;font-style:italic;font-size:11.5px;color:var(--ink2);line-height:1.65}
.biz-quote:before{content:"❝";position:absolute;left:10px;top:4px;font-size:22px;color:var(--accent-l);font-style:normal}

/* ============ VALUE PROPS ============ */
.vp{list-style:none}
.vp li{position:relative;padding-left:24px;margin-bottom:11px;color:var(--ink2);line-height:1.65}
.vp li:before{content:"▸";position:absolute;left:4px;color:var(--green)}

/* ============ RUNTIME ============ */
.runtime{border:1px solid var(--line2);background:var(--card);padding:12px 16px;margin-top:18px;font-size:11px}
.runtime .t,.lang .t{color:var(--muted);margin-bottom:6px;font-size:11px}
.runtime .t:after{content:"";display:inline-block;width:7px;height:12px;background:var(--green);margin-left:6px;vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
.rt{display:flex;align-items:center;padding:4px 0}
.rt .k{color:var(--muted);width:110px;flex:none}
.rt .dots{flex:1;border-bottom:1px dotted var(--line2);margin:0 8px 3px;min-width:10px}
.rt .v{font-size:10px;letter-spacing:.08em;padding:1px 7px;border:1px solid var(--st-green-border);background:var(--green-bg);color:var(--green-d);white-space:nowrap}
.rt .v.b{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue)}
.rt .v.a{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.rt .v.pulse{position:relative;padding-left:18px}
.rt .v.pulse:before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--pulse),.6)}70%{box-shadow:0 0 0 7px rgba(var(--pulse),0)}100%{box-shadow:0 0 0 0 rgba(var(--pulse),0)}}
.ticker{font-size:10.5px;color:var(--green-d);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line2);min-height:2.3em}
.ticker b{color:var(--muted);font-weight:400}
.ticker #tick:after{content:"▌";color:var(--green);animation:blink 1.05s steps(1) infinite;margin-left:1px}

/* ============ FOCUS TRACKS ============ */
.focus{border-left:3px solid var(--green);padding:6px 12px;margin-top:14px;font-size:11px;color:var(--muted)}
.track{display:grid;grid-template-columns:80px 1fr;align-items:start;margin-top:8px}
.track .ps{display:flex;flex-wrap:wrap;gap:5px}
.track .tk{padding-top:2px;color:var(--green-d);font-size:10.5px}
.track .tk:before{content:"◆ ";color:var(--accent-l);font-size:8px}
.track .pill{font-size:10px;padding:2px 7px;background:var(--green-tint);border-color:var(--feat-border);color:var(--ink2)}

/* ============ INTERESTS & LANG ============ */
.interests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.int{border:1px solid var(--line2);background:var(--card);padding:7px 10px;font-size:11.5px;transition:transform .2s,box-shadow .2s,border-color .2s}
.int:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--shadow);border-color:var(--green)}
.int b{color:var(--muted);font-weight:400;margin-right:8px;font-size:10.5px}
.lang{border:1px solid var(--line2);background:var(--card);padding:10px 16px;margin-top:14px;font-size:11.5px}

/* ============ EDUCATION ============ */
.edu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ed{border:1px solid var(--line2);border-left:4px solid var(--blue);background:var(--card);padding:12px 14px;transition:transform .2s,box-shadow .2s}
.ed:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadow)}
.ed.g{border-left-color:var(--green)}.ed.a{border-left-color:var(--amber)}
.ed h4{font-size:12.5px;font-weight:500}
.ed .inst{color:var(--amber);font-size:11px}
.ed .when{color:var(--muted);font-size:10.5px}
.ed .st{display:inline-block;font-size:9.5px;letter-spacing:.1em;padding:1px 7px;margin:6px 4px 6px 0;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue)}
.ed .st.g{border-color:var(--st-green-border);background:var(--green-bg);color:var(--green-d)}
.ed .st.a{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.ed .st.n{border-color:var(--line2);background:var(--panel);color:var(--muted)}
.ed p{font-size:10.5px;color:var(--muted);line-height:1.6}

/* ============ FOOTER ============ */
